{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel-card text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3.5rem;"></i>
      <h4 class="mt-3 mb-2">Delete this car?</h4>
      <p class="text-muted mb-4">
        Are you sure you want to delete <strong>{{ car.full_name }}</strong>? This will also affect
        any existing bookings linked to this car. This action cannot be undone.
      </p>

      <img src="{{ car.image.url }}" alt="{{ car.full_name }}" class="rounded-tsd mb-4" style="max-height:160px; object-fit:cover;">

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'dashboard:car_management' %}" class="btn btn-outline-secondary btn-pill px-4">Cancel</a>
          <button type="submit" class="btn btn-danger btn-pill px-4">
            <i class="bi bi-trash-fill"></i> Yes, Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
