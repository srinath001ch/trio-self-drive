{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="panel-card text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3.5rem;"></i>
      <h4 class="mt-3 mb-2">Delete this booking?</h4>
      <p class="text-muted mb-4">
        Are you sure you want to permanently delete booking <strong>#{{ booking.pk }}</strong> for
        <strong>{{ booking.customer_name }}</strong>? This action cannot be undone.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'dashboard:booking_detail' booking.pk %}" class="btn btn-outline-secondary btn-pill px-4">Cancel</a>
          <button type="submit" class="btn btn-danger btn-pill px-4">
            <i class="bi bi-trash-fill"></i> Yes, Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
