{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | {{ SITE_NAME }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

  <div class="dashboard-login-wrap">
    <div class="dashboard-login-card">
      <div class="text-center mb-4">
        <div class="login-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h3>Staff Dashboard</h3>
        <p class="text-muted mb-0">Sign in to manage Trio Self Drive</p>
      </div>

      {% include 'partials/messages.html' %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="{% url 'core:home' %}" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Website</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
