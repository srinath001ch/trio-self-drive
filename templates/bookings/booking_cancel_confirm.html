{% extends 'base.html' %}

{% block content %}

<section class="section-pad" style="min-height:60vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="form-card text-center">
          <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:3.5rem;"></i>
          <h3 class="mt-3 mb-2">Cancel This Booking?</h3>
          <p class="text-muted mb-4">
            Are you sure you want to cancel your booking for <strong>{{ booking.car.full_name }}</strong>
            (Booking #{{ booking.pk }})? This action cannot be undone.
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'bookings:booking_status' booking.pk %}" class="btn btn-outline-secondary btn-pill px-4">
                No, Keep It
              </a>
              <button type="submit" class="btn btn-danger btn-pill px-4">
                <i class="bi bi-x-circle"></i> Yes, Cancel Booking
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
